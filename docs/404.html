<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page Not Found - NFL Schedules</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:ital,wght@0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1b1e27;
    --ink-soft: #565c6b;
    --bg: #eef0f4;
    --paper: #ffffff;
    --line: #d9dce3;
  }
  html { color-scheme: light; background: var(--bg); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .card {
    max-width: 480px;
    margin: 20px;
    padding: 40px 32px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    text-align: center;
  }
  .eyebrow {
    font-size: 12.5px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }
  h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: 28px;
    text-transform: uppercase;
    margin: 0 0 12px;
  }
  p { font-size: 14px; color: var(--ink-soft); margin: 0 0 24px; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 11px 22px;
    font-size: 13.5px;
    font-weight: 700;
    text-decoration: none;
    border-radius: 3px;
    background: var(--ink);
    color: #fff;
    letter-spacing: 0.01em;
  }
  .btn:hover { filter: brightness(1.2); }
  a:focus-visible, .btn:focus-visible {
    outline: 2px solid #ff4d5e;
    outline-offset: 2px;
    border-radius: 4px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">404</div>
    <h1>Page Not Found</h1>
    <p>That team page or link doesn&rsquo;t exist. It may have moved, or the URL might have a typo.</p>
    <a class="btn" href="/">&larr; Back to All Teams</a>
  </div>
</body>
</html>
