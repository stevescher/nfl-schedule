<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NFL Schedules</title>
<meta name="description" content="Every NFL team's schedule, with subscribable calendars showing kickoff times and where to watch." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:ital,wght@0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1b1e27;
    --ink-soft: #565c6b;
    --bg: #eef0f4;
    --paper: #ffffff;
    --line: #d9dce3;
    --brand: #1b1e27;
  }
  html { color-scheme: light; background: var(--bg); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  .masthead {
    background: #101319;
    background-image: linear-gradient(160deg, #1a1f2b 0%, #0a0c10 100%);
    color: #fff;
    padding: 54px 20px 44px;
    text-align: center;
  }
  .masthead h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(32px, 6vw, 52px);
    margin: 0 0 12px;
    text-transform: uppercase;
    letter-spacing: -0.01em;
  }
  .masthead p {
    color: #a9adb8;
    font-size: 15px;
    max-width: 42ch;
    margin: 0 auto;
  }

  .search-wrap {
    max-width: 560px;
    margin: -26px auto 0;
    padding: 0 20px;
    position: relative;
    z-index: 3;
  }
  .search-box {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    box-shadow: 0 14px 34px -16px rgba(0,0,0,0.35);
    padding: 4px 6px 4px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .search-box svg { flex-shrink: 0; opacity: 0.45; }
  .search-box input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-family: inherit;
    font-size: 15px;
    padding: 12px 0;
    color: var(--ink);
  }
  .search-box input::placeholder { color: #9aa0ac; }

  .search-results {
    position: absolute;
    top: calc(100% + 8px);
    left: 20px;
    right: 20px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 16px 40px -18px rgba(0,0,0,0.4);
    overflow: hidden;
    z-index: 4;
  }
  .search-results[hidden] { display: none; }
  .search-result {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    cursor: pointer;
    text-decoration: none;
    color: var(--ink);
    border-bottom: 1px solid var(--line);
  }
  .search-result:last-child { border-bottom: none; }
  .search-result:hover,
  .search-result.active { background: var(--bg); }
  .search-result .swatch {
    width: 10px;
    height: 28px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .search-result .info { min-width: 0; }
  .search-result .full-name { font-weight: 800; font-size: 14.5px; }
  .search-result .abbr { font-size: 11.5px; color: var(--ink-soft); font-weight: 600; }
  .search-empty { padding: 16px; font-size: 13px; color: var(--ink-soft); text-align: center; }

  .wrap { max-width: 920px; margin: 0 auto; padding: 52px 20px 70px; }
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 3px solid var(--ink);
  }
  .section-head h2 {
    font-family: 'Archivo Black', sans-serif;
    font-size: 18px;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    margin: 0;
  }
  .section-head .count { font-size: 12px; color: var(--ink-soft); font-weight: 600; }

  .conference-block { margin-bottom: 8px; }
  .conference-label {
    font-family: 'Archivo Black', sans-serif;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin: 0 0 14px;
  }
  .division-block { margin-bottom: 32px; }
  .division-block:last-child { margin-bottom: 0; }
  .division-head {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 0 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }

  .team-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  .team-card {
    display: block;
    text-decoration: none;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 18px;
    position: relative;
    overflow: hidden;
    transition: transform 0.1s ease, box-shadow 0.15s ease;
  }
  .team-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px -14px rgba(0,0,0,0.3);
  }
  .team-card .bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
  }
  .team-card .city {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    margin-top: 6px;
  }
  .team-card .name {
    font-family: 'Archivo Black', sans-serif;
    font-size: 19px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .coming-soon {
    background: var(--paper);
    border: 1px dashed var(--line);
    border-radius: 10px;
    padding: 20px;
    font-size: 13px;
    color: var(--ink-soft);
    text-align: center;
  }

  footer {
    max-width: 920px;
    margin: 44px auto 0;
    padding: 22px 20px 0;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--ink-soft);
  }
</style>
</head>
<body>

  <div class="masthead">
    <h1>NFL Schedules</h1>
    <p>Search your team. Get a calendar that stays current all season, with kickoff times and where to watch every game.</p>
  </div>

  <div class="search-wrap">
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="team-search" placeholder="Search for a team (e.g. Bills, Giants, Jets)" autocomplete="off" />
    </div>
    <div class="search-results" id="search-results" hidden></div>
  </div>

  <div class="wrap">
    <div class="section-head">
      <h2>All Teams</h2>
      <span class="count" id="available-count"></span>
    </div>
    <div id="team-sections"></div>

    <footer>
      Schedules compiled from official NFL and team sources, checked weekly for updates.<br>
      Not an official NFL product.
    </footer>
  </div>

<script>
function teamCard(t) {
  const card = document.createElement('a');
  card.className = 'team-card';
  card.href = '/' + t.slug + '/';
  card.innerHTML =
    '<div class="bar" style="background:' + t.colors.primary + '"></div>' +
    '<div class="city">' + t.city + '</div>' +
    '<div class="name">' + t.name + '</div>';
  return card;
}

async function main() {
  const sections = document.getElementById('team-sections');
  const countEl = document.getElementById('available-count');
  const searchInput = document.getElementById('team-search');
  const resultsEl = document.getElementById('search-results');

  let teams = [];
  try {
    const res = await fetch('/data/teams.json', { cache: 'no-store' });
    const data = await res.json();
    teams = data.teams;
  } catch (e) {
    sections.innerHTML = '<div class="coming-soon">Could not load team list. Try refreshing.</div>';
    return;
  }

  countEl.textContent = teams.length + ' team' + (teams.length === 1 ? '' : 's');

  const byDivision = new Map();
  for (const t of teams) {
    const div = t.division || 'Other';
    if (!byDivision.has(div)) byDivision.set(div, []);
    byDivision.get(div).push(t);
  }

  const conferenceOrder = ['AFC', 'NFC'];
  const divisionOrder = ['East', 'North', 'South', 'West'];
  const allDivisions = [...byDivision.keys()].sort((a, b) => {
    const [confA, dirA] = a.split(' ');
    const [confB, dirB] = b.split(' ');
    const confDiff = conferenceOrder.indexOf(confA) - conferenceOrder.indexOf(confB);
    if (confDiff !== 0) return confDiff;
    return divisionOrder.indexOf(dirA) - divisionOrder.indexOf(dirB);
  });

  const frag = document.createDocumentFragment();
  let currentConference = null;
  let conferenceGrid = null;

  for (const division of allDivisions) {
    const conference = division.split(' ')[0];
    if (conference !== currentConference) {
      currentConference = conference;
      const confBlock = document.createElement('div');
      confBlock.className = 'conference-block';
      confBlock.innerHTML = '<p class="conference-label">' + (conference === 'AFC' ? 'AMERICAN FOOTBALL CONFERENCE' : 'NATIONAL FOOTBALL CONFERENCE') + '</p>';
      frag.appendChild(confBlock);
    }

    const divBlock = document.createElement('div');
    divBlock.className = 'division-block';
    divBlock.innerHTML = '<h3 class="division-head">' + division + '</h3>';

    const grid = document.createElement('div');
    grid.className = 'team-grid';
    byDivision.get(division).forEach((t) => grid.appendChild(teamCard(t)));
    divBlock.appendChild(grid);

    frag.appendChild(divBlock);
  }

  sections.appendChild(frag);

  function matchScore(team, query) {
    const q = query.toLowerCase().trim();
    if (!q) return 0;
    if (team.aliases.some((a) => a === q)) return 100;
    if (team.aliases.some((a) => a.startsWith(q))) return 80;
    if (team.aliases.some((a) => a.includes(q))) return 50;
    return 0;
  }

  function renderResults(query) {
    if (!query.trim()) {
      resultsEl.hidden = true;
      resultsEl.innerHTML = '';
      return;
    }

    const ranked = teams
      .map((t) => ({ t, score: matchScore(t, query) }))
      .filter((r) => r.score > 0)
      .sort((a, b) => b.score - a.score)
      .slice(0, 6);

    if (!ranked.length) {
      resultsEl.innerHTML = '<div class="search-empty">No teams found for "' + query + '".</div>';
      resultsEl.hidden = false;
      return;
    }

    resultsEl.innerHTML = ranked
      .map(
        (r) =>
          '<a class="search-result" href="/' + r.t.slug + '/">' +
            '<span class="swatch" style="background:' + r.t.colors.primary + '"></span>' +
            '<span class="info">' +
              '<div class="full-name">' + r.t.fullName + '</div>' +
              '<div class="abbr">' + r.t.abbreviation + '</div>' +
            '</span>' +
          '</a>'
      )
      .join('');
    resultsEl.hidden = false;
  }

  searchInput.addEventListener('input', (e) => renderResults(e.target.value));
  searchInput.addEventListener('focus', (e) => {
    if (e.target.value.trim()) renderResults(e.target.value);
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrap')) {
      resultsEl.hidden = true;
    }
  });
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const first = resultsEl.querySelector('.search-result');
      if (first) window.location.href = first.getAttribute('href');
    }
    if (e.key === 'Escape') {
      resultsEl.hidden = true;
      searchInput.blur();
    }
  });
}

main();
</script>
</body>
</html>
